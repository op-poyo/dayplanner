name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship the Android SDK; AGP fetches platform 35 if missing.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dayplanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Phone-friendly download: Releases → "Latest build" → DayPlanner.apk (no login needed).
      - name: Publish APK to "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DayPlanner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DayPlanner.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download DayPlanner.apk and tap to install." \
            --latest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
